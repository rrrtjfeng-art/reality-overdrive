<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07121e"><title>财富帝国：深空资本</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193c50,#07121e 65%,#03080d);color:#eaf7ff;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:12px 12px 30px}header,.row,.section{display:flex;justify-content:space-between;align-items:center;gap:8px}header{margin-bottom:12px}.brand{font-size:18px;font-weight:900}.brand span{color:#55e7f2}.rank{border:1px solid #3a6579;border-radius:30px;padding:6px 10px;color:#ffd27b;font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat,.panel,.buy{background:linear-gradient(145deg,#132b3b,#0a1723);border:1px solid #254356;border-radius:13px;padding:10px 12px;min-width:0}.stat small{display:block;color:#8da8b8;font-size:11px}.stat strong{display:block;font-size:clamp(18px,5vw,25px);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gold{color:#ffd27b}.green{color:#7dffbf}.cyan{color:#55e7f2}.scene{position:relative;margin:10px 0;border:1px solid #2c5367;border-radius:16px;overflow:hidden;background:#071522}.scene canvas{display:block;width:100%;height:clamp(220px,60vw,330px)}.overlay{position:absolute;top:10px;left:11px;font-size:11px;line-height:1.6;text-shadow:0 2px 5px #000;letter-spacing:.06em}.overlay b{color:#7dffbf}.foot{position:absolute;bottom:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:10px;color:#c4e6f1;text-shadow:0 1px 5px #000}.section{margin:17px 2px 8px;font-weight:800}.section small{font-size:11px;color:#8da8b8;font-weight:400}.buildings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.buy{text-align:left;min-height:105px;cursor:pointer;color:inherit;font:inherit;touch-action:manipulation}.buy:disabled{opacity:.45}.ico{float:right;font-size:21px}.buy strong{font-size:14px}.desc{font-size:11px;color:#a6c0ce;margin:5px 0 8px;line-height:1.4}.cost{color:#ffd27b;font-size:12px;font-weight:800}.owned{float:right;color:#55e7f2;font-size:11px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button.control{flex:1;min-width:125px;border:1px solid #356175;background:#102637;border-radius:12px;padding:11px 9px;font-size:12px;font-weight:750;color:#eaf7ff;touch-action:manipulation}button.primary{background:linear-gradient(110deg,#0d6678,#167b83);border-color:#59e3e9}button.active{border-color:#7dffbf;color:#7dffbf}.panel{margin-top:10px;font-size:12px;line-height:1.6;color:#b8d1dd}.panel strong{color:#ffd27b}.log{max-height:100px;overflow:auto;color:#9db8c8;font-size:11px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;color:#698b9c;font-size:10px}@media(min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.buildings{grid-template-columns:repeat(3,minmax(0,1fr))}.stat strong{font-size:21px}}
</style></head><body><main class="app"><header><div class="brand">财富帝国 <span>/// DEEP SPACE</span></div><div class="rank" id="rank">创始人 · LV.1</div></header>
<section class="stats"><div class="stat"><small>帝国资产 / CREDITS</small><strong class="gold" id="cash">¢ 120</strong></div><div class="stat"><small>自动现金流 / SEC</small><strong class="green" id="income">¢ 0/s</strong></div><div class="stat"><small>能源储备 / ENERGY</small><strong class="cyan" id="energy">100</strong></div><div class="stat"><small>帝国估值 / VALUE</small><strong id="value">¢ 120</strong></div></section>
<section class="scene"><canvas id="world" aria-label="深空工业基地与无人机动画"></canvas><div class="overlay">SECTOR 07 · <b id="sector">初始殖民地</b><br><span id="status">自动化系统运行中</span></div><div class="foot"><span>深空矿区 · 实时模拟</span><span id="drones">采矿无人机 0 架</span></div></section>
<div class="section">建设财富引擎 <small>设施自动产出</small></div><section class="buildings">
<button class="buy" data-id="mine"><span class="ico">⛏</span><strong>自动采矿站</strong><div class="desc">开采矿物，建立基础收入。</div><span class="cost" id="cost-mine">¢60</span><span class="owned" id="owned-mine">拥有 0</span></button>
<button class="buy" data-id="refinery"><span class="ico">⚙</span><strong>量子精炼厂</strong><div class="desc">加工资源，提高现金流。</div><span class="cost" id="cost-refinery">¢180</span><span class="owned" id="owned-refinery">拥有 0</span></button>
<button class="buy" data-id="server"><span class="ico">▦</span><strong>AI 数据中心</strong><div class="desc">提供算法与数据服务收益。</div><span class="cost" id="cost-server">¢500</span><span class="owned" id="owned-server">拥有 0</span></button>
<button class="buy" data-id="orbital"><span class="ico">◉</span><strong>轨道物流港</strong><div class="desc">扩张运输网络与帝国估值。</div><span class="cost" id="cost-orbital">¢1250</span><span class="owned" id="owned-orbital">拥有 0</span></button>
<button class="buy" data-id="fusion"><span class="ico">✦</span><strong>聚变能源塔</strong><div class="desc">优化能源与全设施产出。</div><span class="cost" id="cost-fusion">¢3000</span><span class="owned" id="owned-fusion">拥有 0</span></button>
<button class="buy" data-id="city"><span class="ico">▥</span><strong>星际金融城</strong><div class="desc">建设金融中心，获得高额收益。</div><span class="cost" id="cost-city">¢9000</span><span class="owned" id="owned-city">拥有 0</span></button></section>
<div class="section">帝国管理 <small>自动经营 + 本机存档</small></div><div class="controls"><button class="control primary active" id="auto">自动经营：开启</button><button class="control" id="upgrade">升级 AI 管家 · ¢250</button><button class="control" id="contract">签署贸易合同 · ¢100</button><button class="control" id="save">立即保存</button></div>
<div class="panel" id="mission"><strong>创始人任务：</strong>建设 3 座设施，打造第一条自动现金流。<br>设施总数：0 / 3</div><div class="section">帝国动态 <small>最新记录</small></div><div class="panel log" id="log">系统启动。自动经营已开启。</div><div class="bottom"><span>单机模拟 · 进度保存在本机</span><button class="control" id="reset" style="flex:0;min-width:0;padding:5px 8px">重置存档</button></div></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const defs={mine:{name:'自动采矿站',base:60,rate:1.2},refinery:{name:'量子精炼厂',base:180,rate:4.5},server:{name:'AI 数据中心',base:500,rate:13},orbital:{name:'轨道物流港',base:1250,rate:34},fusion:{name:'聚变能源塔',base:3000,rate:25},city:{name:'星际金融城',base:9000,rate:110}};
function fresh(){return{cash:120,energy:100,owned:{mine:0,refinery:0,server:0,orbital:0,fusion:0,city:0},ai:1,auto:true,contracts:0,totalEarned:0,elapsed:0,last:Date.now(),log:['系统启动。欢迎来到深空资本时代。','自动经营已开启：AI 会在资金足够时投资。']}}
let s=fresh();
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e4)return(n/1e3).toFixed(1)+'K';return Math.floor(n).toLocaleString('en-US')}
function cost(id){return Math.floor(defs[id].base*Math.pow(1.17,s.owned[id]))}
function rate(){let n=0;for(let id in defs)n+=s.owned[id]*defs[id].rate;return n*(1+s.ai*.12+s.owned.fusion*.18)*(1+s.contracts*.04)}
function count(){return Object.values(s.owned).reduce((a,b)=>a+b,0)}
function log(t){s.log.unshift(t);s.log=s.log.slice(0,4);$('log').innerHTML=s.log.map(x=>'› '+x).join('<br>')}
function save(){s.last=Date.now();try{localStorage.setItem('wealthEmpireSave',JSON.stringify(s))}catch(e){}}
function load(){try{let o=JSON.parse(localStorage.getItem('wealthEmpireSave'));if(o&&o.owned&&typeof o.cash==='number'){s=Object.assign(fresh(),o);s.owned=Object.assign(fresh().owned,o.owned);let away=Math.min(14400,Math.max(0,(Date.now()-(o.last||Date.now()))/1000));if(away>10){let g=rate()*away*.35;s.cash+=g;s.totalEarned+=g;log('离线经营结算 +'+fmt(g)+'（35%效率）')}}}catch(e){}s.last=Date.now()}
function buy(id,quiet){let c=cost(id);if(s.cash<c){if(!quiet)log('资金不足，需要 ¢ '+fmt(c)+'。');return false}s.cash-=c;s.owned[id]++;if(!quiet)log('建成 '+defs[id].name+'，现金流提升。');return true}
function invest(){let ids=Object.keys(defs).filter(id=>s.cash>=cost(id));if(!ids.length)return;ids.sort((a,b)=>defs[b].rate/cost(b)-defs[a].rate/cost(a));buy(ids[0],true)}
function render(){
$('cash').textContent='¢ '+fmt(s.cash);$('income').textContent='¢ '+fmt(rate())+'/s';$('energy').textContent=fmt(Math.max(0,s.energy));$('value').textContent='¢ '+fmt(s.cash+Object.keys(defs).reduce((a,id)=>a+s.owned[id]*defs[id].base*.72,0));$('rank').textContent='创始人 · LV.'+(1+Math.floor(count()/3)+Math.floor(s.ai/3));$('drones').textContent='采矿无人机 '+(s.owned.mine*2+s.owned.orbital)+' 架';$('sector').textContent=count()>=10?'星际金融区':count()>=5?'深空工业区':'初始殖民地';$('status').textContent=s.auto?'自动化系统运行中 · AI '+s.ai+'级':'手动经营模式';
for(let id in defs){$('cost-'+id).textContent='¢ '+fmt(cost(id));$('owned-'+id).textContent='拥有 '+s.owned[id];document.querySelector('[data-id="'+id+'"]').disabled=s.cash<cost(id)}
$('auto').textContent='自动经营：'+(s.auto?'开启':'关闭');$('auto').classList.toggle('active',s.auto);$('upgrade').textContent='升级 AI 管家 · ¢'+fmt(250*Math.pow(2,s.ai-1));$('contract').textContent='签署贸易合同 · ¢'+fmt(100*Math.pow(1.5,s.contracts));$('mission').innerHTML='<strong>创始人任务：</strong>'+(count()>=3?'已完成第一条现金流！下一目标：资产达到 ¢10,000。':'建设 '+(3-count())+' 座设施，打造第一条自动现金流。')+'<br>设施总数：'+count()+' / 3 · 累计收益：¢ '+fmt(s.totalEarned)
}
document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{if(buy(b.dataset.id,false)){render();save()}}));
$('auto').addEventListener('click',()=>{s.auto=!s.auto;log('自动经营已'+(s.auto?'开启':'关闭')+'。');render();save()});
$('upgrade').addEventListener('click',()=>{let c=250*Math.pow(2,s.ai-1);if(s.cash<c){log('资金不足：升级 AI 需要 ¢'+fmt(c)+'。');return}s.cash-=c;s.ai++;log('AI 管家升级至 '+s.ai+' 级，全设施收益提升。');render();save()});
$('contract').addEventListener('click',()=>{let c=Math.floor(100*Math.pow(1.5,s.contracts));if(s.cash<c){log('资金不足：贸易合同需要 ¢'+fmt(c)+'。');return}s.cash-=c;s.contracts++;log('贸易合同生效，现金流永久提升 4%。');render();save()});
$('save').addEventListener('click',()=>{save();log('帝国进度已保存到本机。')});
$('reset').addEventListener('click',()=>{if(confirm('确定清空本机帝国进度？此操作无法撤销。')){localStorage.removeItem('wealthEmpireSave');s=fresh();render();log('新帝国初始化完成。')}});
const canvas=$('world'),ctx=canvas.getContext('2d');let W=600,H=300,dpr=1;
function resize(){let r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(300,r.width);H=Math.max(210,r.height);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function draw(t){
ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#081526');sky.addColorStop(.55,'#102b3d');sky.addColorStop(1,'#050d15');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
for(let i=0;i<65;i++){let x=i*97.13%W,y=i*47.7%(H*.58);ctx.fillStyle='rgba(160,230,255,'+(.2+(i%4)*.12)+')';ctx.fillRect(x,y,i%7===0?2:1,i%7===0?2:1)}
let px=W*.73,py=H*.25,pr=Math.min(W,H)*.13,p=ctx.createRadialGradient(px-pr*.4,py-pr*.5,2,px,py,pr);p.addColorStop(0,'#b9d5d5');p.addColorStop(.45,'#47798d');p.addColorStop(1,'#142d47');ctx.fillStyle=p;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#71eaff66';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px,py,pr*1.55,pr*.38,-.25,0,Math.PI*2);ctx.stroke();
let ground=H*.72;ctx.fillStyle='#0a1924';ctx.beginPath();ctx.moveTo(0,ground+8);ctx.lineTo(W*.15,ground-14);ctx.lineTo(W*.3,ground+4);ctx.lineTo(W*.47,ground-23);ctx.lineTo(W*.64,ground+2);ctx.lineTo(W*.82,ground-17);ctx.lineTo(W,ground+5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.strokeStyle='#24536a';for(let j=0;j<5;j++){ctx.beginPath();ctx.moveTo(0,ground+20+j*14);ctx.lineTo(W,ground+20+j*14);ctx.stroke()}
let bs=[{x:.08,w:.13,h:.20,c:'#255065'},{x:.24,w:.12,h:.34,c:'#1b4054'},{x:.40,w:.16,h:.24,c:'#2b5367'},{x:.61,w:.12,h:.30,c:'#1a4058'},{x:.79,w:.15,h:.18,c:'#244b5e'}];
for(let i=0;i<Math.min(5,Math.max(1,count()+1));i++){let b=bs[i],x=W*b.x,bw=W*b.w,bh=H*b.h,y=ground-bh;ctx.fillStyle=b.c;ctx.fillRect(x,y,bw,bh);ctx.fillStyle='#5de7ed';ctx.fillRect(x+bw*.15,y+5,bw*.7,2);for(let wy=y+12;wy<ground-5;wy+=12)for(let wx=x+5;wx<x+bw-3;wx+=10){ctx.fillStyle=(Math.floor(wx+wy+t*3)%5<2)?'#7bf3ec':'#34596a';ctx.fillRect(wx,wy,4,5)}ctx.fillStyle='#08131d';ctx.fillRect(x-4,ground-3,bw+8,6)}
function drone(x,y,ph){ctx.save();ctx.translate(x,y+Math.sin(t*2+ph)*5);ctx.rotate(Math.sin(t+ph)*.12);ctx.fillStyle='#a9d6e3';ctx.fillRect(-9,-3,18,6);ctx.fillStyle='#4ee8ef';ctx.fillRect(-4,-5,8,2);ctx.strokeStyle='#74f7ff';ctx.beginPath();ctx.moveTo(0,4);ctx.lineTo(0,13);ctx.stroke();ctx.fillStyle='#ffce73';ctx.beginPath();ctx.arc(0,0,2.5,0,7);ctx.fill();ctx.restore()}
let n=Math.min(12,s.owned.mine*2+s.owned.orbital);for(let i=0;i<Math.max(2,n);i++)drone(((t*28+i*W/Math.max(2,n))%(W+40))-20,H*.53+(i%3)*14,i);
ctx.fillStyle='#d9faff';ctx.font='bold 11px system-ui';ctx.fillText('DEEP SPACE INDUSTRIAL COMPLEX',12,H-12);ctx.fillStyle='#53e5ef';ctx.fillRect(W*.48,H*.64,Math.min(W*.45,20+count()*8),3)
}
let last=performance.now(),tick=0,lastRender=0,lastSave=0;function loop(now){let dt=Math.min(.25,Math.max(0,(now-last)/1000));last=now;s.elapsed+=dt;tick+=dt;let g=rate()*dt;s.cash+=g;s.totalEarned+=g;s.energy=Math.max(0,Math.min(999999,s.energy+(15-s.owned.fusion*15)*dt*.02));if(s.auto&&tick>.9){tick=0;if(s.cash>cost('mine')*1.25)invest()}if(now-lastRender>300){render();lastRender=now}if(now-lastSave>10000){save();lastSave=now}draw(now/1000);requestAnimationFrame(loop)}
load();render();requestAnimationFrame(loop);window.addEventListener('beforeunload',save)
})();
</script></body></html>
